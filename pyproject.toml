[project]
name = "remote-optical-drive-manager"
version = "0.1.0"
description = "Remote CD/DVD drive manager: PySide6 client + restricted Linux agent"
requires-python = ">=3.10"
dependencies = [
    "paramiko>=3.0",
    "requests>=2.28",
]

[project.optional-dependencies]
client = ["PySide6>=6.5"]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
